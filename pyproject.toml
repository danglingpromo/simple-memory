[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-memory"
version = "0.1.0"
description = "Significance-based auto-compaction of agentic awareness notes"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
simple-memory = "simple_memory.__main__:main"

[tool.setuptools]
packages = ["simple_memory"]
